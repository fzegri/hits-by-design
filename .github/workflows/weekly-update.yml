name: Weekly update

on:
  schedule:
    - cron: "31 17 * * 6"   # Saturdays 17:31 UTC = 1:31 PM Puerto Rico
  workflow_dispatch:         # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Pull new numbers from kworb
        run: |
          set +e
          python3 weekly_update.py
          code=$?
          set -e
          if [ "$code" -eq 1 ]; then
            echo "::error::Numbers failed the checks. Nothing was changed this week."
            exit 1
          fi

      - name: Save the new week
        run: |
          if git diff --quiet -- data.js history.js; then
            echo "No new data this week."
            exit 0
          fi
          git config user.name "hits-by-design-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.js history.js
          git commit -m "Weekly update: $(date -u +%Y-%m-%d)"
          git push
